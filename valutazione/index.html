<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#004860">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Scheda Valutazione Rugby U14</title>
<style>
:root{
  /* Palette Rugby Club Pasian di Prato: teal/petrolio scudo, bronzo/tortora bordo, avorio caldo */
  --bg:#F2EFE6;
  --surface:#FFFFFF;
  --surface-2:#F6F3EC;
  --ink:#12232A;
  --ink-soft:#51666D;
  --pitch:#004860;
  --pitch-dark:#00212F;
  --pitch-line:#DDD1B8;
  --gold:#7C6650;
  --gold-soft:#EDE4D2;
  --low:#B5533C;
  --mid:#B8701F;
  --high:#2E8F72;
  --shadow: 0 2px 10px rgba(18,35,42,0.08);
  --shadow-lg: 0 12px 32px rgba(18,35,42,0.16);
  --radius: 14px;
  --font-display: 'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono: 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:
    radial-gradient(circle at 100% 0%, rgba(0,72,96,0.07), transparent 45%),
    var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ---------- TOPBAR ---------- */
.topbar{
  display:flex;align-items:center;gap:16px;padding:14px 20px;
  background:linear-gradient(135deg,var(--pitch) 0%, var(--pitch-dark) 100%);
  color:#fff;box-shadow:var(--shadow);flex-shrink:0;z-index:20;
}
.topbar .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.topbar .brand .club-logo{height:34px;width:auto;flex-shrink:0;display:block;}
.topbar h1{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;letter-spacing:0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .subtitle{font-size:12px;opacity:0.75;font-family:var(--font-mono);white-space:nowrap;display:none;}
.topbar .actions{display:flex;gap:8px;flex-shrink:0;}
.topbar button{
  background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.28);color:#fff;
  padding:9px 12px;border-radius:10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s;
}
.topbar button:hover{background:rgba(255,255,255,0.22);}
.topbar button:active{transform:scale(0.97);}

/* ---------- LAYOUT ---------- */
.body{flex:1;display:flex;min-height:0;}
.sidebar{width:280px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--pitch-line);display:flex;flex-direction:column;min-height:0;}
.sidebar .search-wrap{padding:14px 14px 8px 14px;}
.sidebar .search-wrap input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--pitch-line);background:var(--surface-2);font-size:14px;color:var(--ink);}
.sidebar .search-wrap input:focus{outline:2px solid var(--pitch);outline-offset:1px;}

.season-select-wrap{margin:0 14px 10px 14px;}
.season-select-wrap select{width:100%;padding:9px 10px;border-radius:9px;border:1px solid var(--pitch-line);background:var(--surface-2);font-size:13px;color:var(--ink);font-weight:600;}
.readonly-card{background:var(--surface-2);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px;}
.readonly-card .rc-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--pitch-line);}
.readonly-card .rc-row:last-child{border-bottom:none;}
.readonly-card .rc-row span:first-child{color:var(--ink-soft);font-weight:600;}
.readonly-card .rc-edit-link{display:inline-block;margin-top:12px;background:var(--pitch);color:#fff;text-decoration:none;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;}
.pdf-report-btn{background:var(--pitch);color:#fff;border:none;padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;}
.pdf-report-btn:hover{opacity:.9;}

.period-switch{
  display:flex;gap:4px;margin:0 14px 10px 14px;background:var(--surface-2);padding:4px;border-radius:10px;
}
.period-switch button{
  flex:1;border:none;background:transparent;padding:7px 4px;border-radius:7px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;
}
.period-switch button.active{background:var(--gold);color:#fff;}

.new-player-btn{
  margin:6px 14px 10px 14px;padding:11px;border-radius:10px;border:1.5px dashed var(--pitch);background:transparent;
  color:var(--pitch-dark);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
}
.new-player-btn:hover{background:var(--gold-soft);}

.squad-view-btn{
  margin:0 14px 8px 14px;padding:11px 12px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);
  color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;
}
.squad-view-btn.active{background:var(--pitch);color:#fff;}
.squad-view-btn:hover:not(.active){background:var(--gold-soft);}

.player-list{flex:1;overflow-y:auto;padding:0 10px 14px 10px;}
.player-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;margin-bottom:2px;border:1px solid transparent;}
.player-row:hover{background:var(--surface-2);}
.player-row.active{background:var(--gold-soft);border-color:var(--gold);}
.player-badge{width:34px;height:34px;border-radius:50%;background:var(--pitch);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:13px;flex-shrink:0;background-size:cover;background-position:center;}
.player-row.active .player-badge{background:var(--gold);}
.player-info{min-width:0;flex:1;}
.player-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-role{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-score-chip{font-family:var(--font-mono);font-size:12px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;}
.empty-list-msg{padding:24px 16px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.5;}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;overflow-y:auto;padding:22px 28px 60px 28px;}
.welcome{max-width:520px;margin:60px auto;text-align:center;color:var(--ink-soft);}
.welcome .ball-big{font-size:44px;display:block;margin-bottom:14px;}
.welcome h2{font-family:var(--font-display);color:var(--ink);font-size:22px;}

.player-header{display:flex;align-items:center;gap:16px;margin-bottom:6px;flex-wrap:wrap;}
.player-header .badge-lg{width:56px;height:56px;border-radius:50%;background:var(--pitch);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:20px;flex-shrink:0;background-size:cover;background-position:center;}
.player-header h2{font-family:var(--font-display);font-size:26px;margin:0;}
.player-header .meta{font-size:13px;color:var(--ink-soft);font-family:var(--font-mono);}
.player-header .delete-btn{margin-left:auto;background:none;border:1px solid var(--low);color:var(--low);padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;}
.player-header .delete-btn:hover{background:var(--low);color:#fff;}

.period-banner{
  display:flex;align-items:center;gap:10px;margin:6px 0 18px 0;padding:9px 14px;border-radius:10px;
  background:var(--gold-soft);color:var(--pitch-dark);font-size:13px;font-weight:600;width:fit-content;
}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--surface-2);padding:5px;border-radius:12px;width:fit-content;}
.tab-btn{border:none;background:transparent;padding:9px 18px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.tab-btn.active{background:var(--pitch);color:#fff;box-shadow:var(--shadow);}

.card{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.3px;}
.field input,.field select,.field textarea{padding:10px 12px;border-radius:9px;border:1px solid var(--pitch-line);background:var(--surface-2);font-size:14.5px;color:var(--ink);}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--pitch);outline-offset:0;}

.player-photo-wrap{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.player-photo{width:92px;height:92px;border-radius:50%;background:var(--surface-2);border:2px solid var(--pitch-line);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:var(--font-mono);font-weight:700;font-size:26px;flex-shrink:0;overflow:hidden;}
.photo-actions{display:flex;flex-wrap:wrap;gap:8px;}
.photo-actions button{padding:9px 14px;border-radius:9px;border:1px solid var(--pitch-line);background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;}
.photo-actions button:hover{background:var(--gold-soft);}
.photo-actions .remove-photo-btn{color:var(--low);border-color:var(--low);background:transparent;}
.photo-actions .remove-photo-btn:hover{background:var(--low);color:#fff;}

.roles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
@media (max-width:700px){.roles-grid{grid-template-columns:repeat(2,1fr);}}
.role-chip{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;border:1px solid var(--pitch-line);
  background:var(--surface-2);font-size:13px;cursor:pointer;user-select:none;
}
.role-chip input{margin:0;accent-color:var(--pitch);width:16px;height:16px;}
.role-chip.checked{border-color:var(--pitch);background:var(--gold-soft);font-weight:600;}

/* Skill groups */
.group{border-left:4px solid var(--group-color, var(--pitch));padding-left:16px;margin-bottom:28px;}
.group:last-child{margin-bottom:4px;}
.group-title{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.group-title h3{font-family:var(--font-display);font-size:18px;margin:0;color:var(--group-color,var(--pitch));}
.group-avg{font-family:var(--font-mono);font-size:13px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surface-2);color:var(--group-color,var(--pitch));border:1px solid var(--group-color,var(--pitch));}

.subsection{margin-bottom:18px;}
.subsection:last-child{margin-bottom:0;}
.subsection-title{display:flex;align-items:center;gap:8px;margin:0 0 4px 0;}
.subsection-title h4{font-size:13.5px;font-weight:700;margin:0;color:var(--ink);text-transform:uppercase;letter-spacing:0.4px;}
.subsection-avg{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-soft);}

.skill-row{padding:11px 0;border-bottom:1px solid var(--pitch-line);}
.skill-row:last-child{border-bottom:none;}
.skill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px;}
.skill-name{font-size:14px;font-weight:600;}
.skill-desc{font-size:11.5px;color:var(--ink-soft);margin:0 0 8px 0;line-height:1.4;}
.skill-value{font-family:var(--font-mono);font-weight:700;font-size:15px;min-width:20px;text-align:center;padding:2px 9px;border-radius:8px;color:#fff;}
.skill-row input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:6px;background:var(--pitch-line);outline:none;}
.skill-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--group-color,var(--pitch));border:3px solid #fff;box-shadow:var(--shadow);cursor:pointer;}
.skill-row input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--group-color,var(--pitch));border:3px solid #fff;box-shadow:var(--shadow);cursor:pointer;}
.scale-hint{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);margin-top:3px;font-family:var(--font-mono);}

/* Riepilogo */
.summary-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
@media (max-width:900px){.summary-grid{grid-template-columns:1fr;}}
.radar-toggle{display:flex;gap:6px;margin-bottom:12px;}
.radar-toggle button{border:1px solid var(--pitch-line);background:var(--surface-2);padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.radar-toggle button.active{background:var(--pitch);border-color:var(--pitch);color:#fff;}
canvas{max-width:100%;display:block;margin:0 auto;}

.area-bars{display:flex;flex-direction:column;gap:14px;}
.area-bar-row .label-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px;}
.area-bar-row .value-mono{font-family:var(--font-mono);}
.bar-track{height:12px;background:var(--surface-2);border-radius:8px;overflow:hidden;border:1px solid var(--pitch-line);}
.bar-fill{height:100%;border-radius:8px;transition:width .3s;}

.total-badge{margin-top:18px;text-align:center;padding:18px;border-radius:var(--radius);background:linear-gradient(135deg,var(--pitch),var(--pitch-dark));color:#fff;position:relative;}
.total-badge .num{font-family:var(--font-mono);font-size:38px;font-weight:700;display:block;}
.total-badge .lbl{font-size:12px;opacity:0.8;letter-spacing:0.5px;text-transform:uppercase;}
.total-badge .delta{font-family:var(--font-mono);font-size:12.5px;margin-top:6px;display:inline-block;padding:2px 10px;border-radius:20px;background:rgba(255,255,255,0.18);}

/* Squad table */
.table-wrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;}
table{border-collapse:collapse;width:100%;font-size:13px;}
th,td{padding:10px 12px;text-align:center;white-space:nowrap;}
th{background:var(--pitch);color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:0.3px;position:sticky;top:0;}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;}
tbody tr:nth-child(even){background:var(--surface-2);}
tbody tr:hover{background:var(--gold-soft);cursor:pointer;}
td.mono{font-family:var(--font-mono);font-weight:700;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-lg);transition:transform .25s ease;z-index:100;max-width:90vw;}
.toast.show{transform:translateX(-50%) translateY(0);}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,30,20,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:380px;width:100%;box-shadow:var(--shadow-lg);}
.modal h3{font-family:var(--font-display);margin-top:0;}
.modal .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
.modal button{padding:10px 16px;border-radius:9px;border:none;font-size:13.5px;font-weight:600;cursor:pointer;}
.modal .cancel{background:var(--surface-2);color:var(--ink);}
.modal .confirm{background:var(--low);color:#fff;}

.hidden{display:none !important;}

@media (max-width:760px){
  .sidebar{position:fixed;left:0;top:60px;bottom:0;z-index:30;transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .main{padding:16px;}
  .field-row{grid-template-columns:1fr;}
  .topbar h1{font-size:16px;}
  .menu-toggle{display:flex !important;}
  .roles-grid{grid-template-columns:repeat(2,1fr);}
}
.menu-toggle{display:none;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.28);color:#fff;width:38px;height:38px;border-radius:10px;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;}
</style>
</head>

function scoreColor(v){
  if(v === null || v === undefined || isNaN(v)) return '#999';
  if(v < 2) return getCss('--low');
  if(v < 3.5) return getCss('--mid');
  return getCss('--high');
}
function getCss(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

var STORAGE_KEY = 'rugbyU14_valutazioni_v2';
var qs = new URLSearchParams(window.location.search);
var state = {
  players: [],
  view: 'squad',
  activePlayerId: null,
  activeTab: 'scheda',
  radarMode: 'generale',
  activePeriod: 'settembre',
  activeSeasonId: null,
  search: ''
};

function loadData(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      state.players = parsed.players || [];
    } else {
      var legacy = localStorage.getItem('rugbyU14_valutazioni_v1');
      if(legacy){
        var lp = JSON.parse(legacy);
        state.players = (lp.players||[]).map(migrateLegacyPlayer);
      }
    }
  }catch(e){ console.error('Errore caricamento dati', e); }
  state.players.forEach(ensurePlayerShape);

  if(qs.get('season')) window.SquadraStore.setActiveSeasonId(qs.get('season'));
  state.activeSeasonId = window.SquadraStore.getActiveSeasonId();
  window.SquadraStore.syncAppPlayers(state.players, state.activeSeasonId, {
    richFields: true,
    createLocal: function(sp){ return newPlayer(sp.nome, sp.id); }
  });
  state.players.forEach(ensurePlayerShape);

  if(qs.get('player')){
    state.view = 'player';
    state.activePlayerId = qs.get('player');
    state.activeTab = 'scheda';
  }
}
function visiblePlayers(){
  var rosterIds = {};
  window.SquadraStore.getPlayers(state.activeSeasonId).forEach(function(p){ rosterIds[p.id]=true; });
  return state.players.filter(function(p){ return rosterIds[p.id]; });
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({players: state.players})); }
  catch(e){ showToast('Impossibile salvare: memoria piena o non disponibile.'); }
}
function migrateLegacyPlayer(p){
  var np = {
    id: p.id || uid(),
    nome: p.nome || 'Giocatore',
    ruoli: p.ruolo && p.ruolo!=='Non assegnato' ? [p.ruolo] : [],
    ruoloPrevalente: p.ruolo && p.ruolo!=='Non assegnato' ? p.ruolo : '',
    annoNascita: p.eta ? String(new Date().getFullYear() - Number(p.eta)) : '',
    note: p.note || '',
    valutazioni: {}
  };
  PERIODS.forEach(function(per){ np.valutazioni[per.key] = {scores:{}}; });
  np.valutazioni.settembre.scores = p.scores || {};
  return np;
}
function ensurePlayerShape(p){
  if(!p.ruoli) p.ruoli = [];
  if(p.ruoloPrevalente===undefined) p.ruoloPrevalente = p.ruoli[0] || '';
  if(p.annoNascita===undefined) p.annoNascita = '';
  if(!p.note) p.note = p.note || '';
  if(p.foto===undefined) p.foto = '';
  if(!p.valutazioni) p.valutazioni = {};
  PERIODS.forEach(function(per){
    if(!p.valutazioni[per.key]) p.valutazioni[per.key] = {scores:{}};
    if(!p.valutazioni[per.key].scores) p.valutazioni[per.key].scores = {};
  });
  return p;
}

function uid(){ return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

function newPlayer(nome, id){
  var p = { id: id || uid(), nome: nome || 'Nuovo giocatore', ruoli:[], ruoloPrevalente:'', annoNascita:'', note:'', foto:'', valutazioni:{} };
  ensurePlayerShape(p);
  return p;
}
function getInitials(player){
  return player.nome.trim().split(/\s+/).map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();
}
function avatarHtml(player, cssClass){
  var initials = getInitials(player);
  if(player.foto){
    return '<div class="'+cssClass+'" style="background-image:url(&quot;'+player.foto+'&quot;)"></div>';
  }
  return '<div class="'+cssClass+'">'+(initials||'?')+'</div>';
}
function resizeImageFile(file, maxW, maxH, quality, onDone, onError){
  var reader = new FileReader();
  reader.onerror = function(){ onError && onError(); };
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxW / w, maxH / h);
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);
      try{
        var dataUrl = canvas.toDataURL('image/jpeg', quality);
        onDone(dataUrl);
      }catch(e){ onError && onError(); }
    };
    img.onerror = function(){ onError && onError(); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function getScores(player, period){
  ensurePlayerShape(player);
  return player.valutazioni[period || state.activePeriod].scores;
}
function roleDisplay(player){
  if(!player.ruoli || player.ruoli.length===0) return 'Non assegnato';
  var extra = player.ruoli.length - 1;
  return (player.ruoloPrevalente || player.ruoli[0]) + (extra>0 ? ' (+'+extra+')' : '');
}

/* ============================================================
   CALCOLI
============================================================ */
function subsectionAverage(scores, sub){
  var sum=0,n=0;
  sub.skills.forEach(function(s){
    var v = scores[s.id];
    if(v!==undefined && v!==null && v!==''){ sum+=Number(v); n++; }
  });
  return n>0 ? sum/n : null;
}
function groupAverage(scores, group){
  var sum=0,n=0;
  group.subsections.forEach(function(sub){
    var a = subsectionAverage(scores, sub);
    if(a!==null){ sum+=a; n++; }
  });
  return n>0 ? sum/n : null;
}
function totalAverage(scores){
  var sum=0,n=0;
  SKILL_GROUPS.forEach(function(g){
    var a = groupAverage(scores, g);
    if(a!==null){ sum+=a; n++; }
  });
  return n>0 ? sum/n : null;
}
function fmt(v){ return (v===null||v===undefined||isNaN(v)) ? '-' : v.toFixed(1); }
function periodLabel(key){ var p = PERIODS.find(function(x){return x.key===key;}); return p?p.label:key; }
function previousPeriodKey(key){
  var idx = PERIODS.findIndex(function(p){return p.key===key;});
  return idx>0 ? PERIODS[idx-1].key : null;
}
function periodHasData(player, period){
  var scores = getScores(player, period);
  return Object.keys(scores).length>0;
}

/* ============================================================
   RADAR CHART (canvas, nessuna libreria esterna)
============================================================ */
function drawRadar(canvas, labels, values, color){
  var dpr = window.devicePixelRatio || 1;
  var cssSize = canvas.parentElement.clientWidth > 480 ? 460 : Math.max(280, canvas.parentElement.clientWidth - 20);
  canvas.style.width = cssSize + 'px';
  canvas.style.height = cssSize + 'px';
  canvas.width = cssSize * dpr;
  canvas.height = cssSize * dpr;
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);

  var size = cssSize;
  var cx = size/2, cy = size/2;
  var labelPad = labels.length > 10 ? 52 : 60;
  var radius = size/2 - labelPad;
  var n = labels.length;
  var maxVal = 5;
  var lineColor = getCss('--pitch-line') || '#D9D4BE';
  var inkSoft = getCss('--ink-soft') || '#4A5A4C';

  ctx.clearRect(0,0,size,size);

  var rings = 5, r, i, ang, x, y;
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 1;
  for(r=1; r<=rings; r++){
    var rr = radius * (r/rings);
    ctx.beginPath();
    for(i=0;i<=n;i++){
      ang = (Math.PI*2*i/n) - Math.PI/2;
      x = cx + rr*Math.cos(ang);
      y = cy + rr*Math.sin(ang);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  ctx.strokeStyle = lineColor;
  for(i=0;i<n;i++){
    ang = (Math.PI*2*i/n) - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx + radius*Math.cos(ang), cy + radius*Math.sin(ang));
    ctx.stroke();
  }

  ctx.beginPath();
  var v, rr2, x2, y2;
  for(i=0;i<n;i++){
    ang = (Math.PI*2*i/n) - Math.PI/2;
    v = values[i]===null||values[i]===undefined?0:values[i];
    rr2 = radius*(v/maxVal);
    x2 = cx+rr2*Math.cos(ang); y2 = cy+rr2*Math.sin(ang);
    if(i===0) ctx.moveTo(x2,y2); else ctx.lineTo(x2,y2);
  }
  ctx.closePath();
  ctx.fillStyle = hexToRgba(color,0.28);
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.2;
  ctx.stroke();

  for(i=0;i<n;i++){
    ang = (Math.PI*2*i/n) - Math.PI/2;
    v = values[i]===null||values[i]===undefined?0:values[i];
    rr2 = radius*(v/maxVal);
    x2 = cx+rr2*Math.cos(ang); y2 = cy+rr2*Math.sin(ang);
    ctx.beginPath();
    ctx.arc(x2,y2,3.4,0,Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  ctx.fillStyle = inkSoft;
  ctx.font = (n>10 ? '9.5px' : '12px') + ' -apple-system, sans-serif';
  for(i=0;i<n;i++){
    ang = (Math.PI*2*i/n) - Math.PI/2;
    var lx = cx + (radius+16)*Math.cos(ang);
    var ly = cy + (radius+16)*Math.sin(ang);
    var align='center';
    if(Math.cos(ang)>0.3) align='left'; else if(Math.cos(ang)<-0.3) align='right';
    ctx.textAlign = align; ctx.textBaseline='middle';
    var lbl = labels[i];
    if(n>10 && lbl.length>14) lbl = lbl.slice(0,13)+'...';
    ctx.fillText(lbl, lx, ly);
  }
}
function hexToRgba(hex, alpha){
  var h = hex.replace('#','');
  if(h.length===3) h = h.split('').map(function(c){return c+c;}).join('');
  var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

var toastTimer=null;
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}
function confirmModal(title, text, onConfirm){
  var backdrop = document.getElementById('modalBackdrop');
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  backdrop.classList.remove('hidden');
  var confirmBtn = document.getElementById('modalConfirm');
  var cancelBtn = document.getElementById('modalCancel');
  function cleanup(){ backdrop.classList.add('hidden'); confirmBtn.removeEventListener('click', onOk); cancelBtn.removeEventListener('click', onCancel); }
  function onOk(){ cleanup(); onConfirm(); }
  function onCancel(){ cleanup(); }
  confirmBtn.addEventListener('click', onOk);
  cancelBtn.addEventListener('click', onCancel);
}

function renderPeriodSwitch(){
  var el = document.getElementById('periodSwitch');
  el.innerHTML = PERIODS.map(function(p){
    return '<button data-period="'+p.key+'" class="'+(state.activePeriod===p.key?'active':'')+'">'+p.label+'</button>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){
      state.activePeriod = btn.getAttribute('data-period');
      renderAll();
    });
  });
}

function renderSidebar(){
  var list = document.getElementById('playerList');
  var search = state.search.toLowerCase();
  var players = visiblePlayers().filter(function(p){ return p.nome.toLowerCase().indexOf(search)!==-1; })
    .sort(function(a,b){ return a.nome.localeCompare(b.nome); });

  document.getElementById('squadViewBtn').classList.toggle('active', state.view==='squad');

  if(players.length===0){
    list.innerHTML = '<div class="empty-list-msg">Nessun giocatore trovato.<br>Usa "+ Nuovo giocatore" per iniziare.</div>';
    return;
  }

  list.innerHTML = players.map(function(p){
    var tot = totalAverage(getScores(p));
    var active = (state.view==='player' && state.activePlayerId===p.id);
    var chipColor = scoreColor(tot);
    return '<div class="player-row'+(active?' active':'')+'" data-id="'+p.id+'">'+
      avatarHtml(p,'player-badge')+
      '<div class="player-info">'+
        '<div class="player-name">'+escapeHtml(p.nome)+'</div>'+
        '<div class="player-role">'+escapeHtml(roleDisplay(p))+'</div>'+
      '</div>'+
      '<div class="player-score-chip" style="background:'+chipColor+'22;color:'+chipColor+'">'+fmt(tot)+'</div>'+
    '</div>';
  }).join('');

  Array.prototype.forEach.call(list.querySelectorAll('.player-row'), function(row){
    row.addEventListener('click', function(){
      state.view='player'; state.activePlayerId = row.getAttribute('data-id'); state.activeTab='scheda';
      closeSidebarMobile(); renderAll();
    });
  });
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

  renderPeriodSwitch();
  renderSidebar();
  renderMain();
  updateSubtitle();
  saveData();
  document.getElementById('confrontoLinkBtn').classList.toggle('hidden', state.view!=='player');

function updateSubtitle(){
  var players = visiblePlayers();
  var n = players.length;
  var sub = document.getElementById('squadSubtitle');
  if(n===0){ sub.textContent=''; return; }
  var sum=0,c=0;
  players.forEach(function(p){ var t=totalAverage(getScores(p)); if(t!==null){sum+=t;c++;} });
  var avg = c>0 ? (sum/c).toFixed(1) : '-';
  sub.textContent = n + ' giocatori - ' + periodLabel(state.activePeriod) + ' - media squadra ' + avg;
  sub.style.display='block';
}

function renderMain(){
  var main = document.getElementById('main');
  if(state.view==='squad'){ main.innerHTML = renderSquadView(); attachSquadEvents(); return; }
  var player = state.players.find(function(p){return p.id===state.activePlayerId;});
  if(!player){ state.view='squad'; renderMain(); return; }
  main.innerHTML = renderPlayerView(player);
  attachPlayerEvents(player);
  if(state.activeTab==='scheda'){ setTimeout(function(){ renderRadarForPlayer(player); }, 0); }
}

/* ---------- Vista Squadra ---------- */
function renderSquadView(){
  var squadPlayers = visiblePlayers();
  if(squadPlayers.length===0){
    return '<div class="welcome"><span class="ball-big">&#127945;</span>'+
      '<h2>Nessun giocatore in rosa</h2><p>Aggiungi il primo giocatore dalla pagina Squadra per iniziare la valutazione.</p></div>';
  }
  var rows = squadPlayers.slice().sort(function(a,b){return a.nome.localeCompare(b.nome);}).map(function(p){
    var scores = getScores(p);
    var cells = '<td>'+escapeHtml(p.nome)+'</td><td>'+escapeHtml(roleDisplay(p))+'</td>';
    SKILL_GROUPS.forEach(function(g){
      var a = groupAverage(scores,g);
      cells += '<td class="mono" style="color:'+scoreColor(a)+'">'+fmt(a)+'</td>';
    });
    var tot = totalAverage(scores);
    cells += '<td class="mono" style="color:'+scoreColor(tot)+'"><strong>'+fmt(tot)+'</strong></td>';
    return '<tr data-id="'+p.id+'">'+cells+'</tr>';
  }).join('');

  var headCols = SKILL_GROUPS.map(function(g){return '<th>'+g.short+'</th>';}).join('');

  return '<h2 style="font-family:var(--font-display);margin-top:0;">Vista Squadra <span style="font-size:14px;color:var(--ink-soft);font-family:var(--font-mono);">— '+periodLabel(state.activePeriod)+'</span></h2>'+
  '<div class="table-wrap"><table><thead><tr><th>Giocatore</th><th>Ruolo</th>'+headCols+'<th>Totale</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function attachSquadEvents(){

    row.addEventListener('click', function(){
      state.view='player'; state.activePlayerId = row.getAttribute('data-id'); state.activeTab='scheda';
      renderAll();
    });
  });
}

  return html;
}
function tabBtn(key,label){ return '<button class="tab-btn'+(state.activeTab===key?' active':'')+'" data-tab="'+key+'">'+label+'</button>'; }

function renderTabDati(player){
  var initials = getInitials(player);
  var photoPreview = player.foto
    ? '<div class="player-photo" id="playerPhotoPreview" style="background-image:url(&quot;'+player.foto+'&quot;)"></div>'
    : '<div class="player-photo" id="playerPhotoPreview">'+(initials||'?')+'</div>';
  var editUrl = '../squadra/?player='+encodeURIComponent(player.id)+'&season='+encodeURIComponent(state.activeSeasonId)+'&edit=1';

  return '<div class="card">'+
    '<div class="player-photo-wrap">'+
      photoPreview+
      '<div style="font-size:12.5px;color:var(--ink-soft);max-width:340px;">I dati anagrafici, la foto e i ruoli sono condivisi con l\'Autovalutazione e si modificano dalla pagina Squadra.</div>'+
    '</div>'+
    '<div class="readonly-card">'+
      '<div class="rc-row"><span>Nome e Cognome</span><span>'+escapeHtml(player.nome)+'</span></div>'+
      '<div class="rc-row"><span>Anno di nascita</span><span>'+(player.annoNascita?escapeHtml(player.annoNascita):'-')+'</span></div>'+
      '<div class="rc-row"><span>Ruoli</span><span>'+(player.ruoli.length?escapeHtml(player.ruoli.join(', ')):'-')+'</span></div>'+
      '<div class="rc-row"><span>Ruolo prevalente</span><span>'+(player.ruoloPrevalente?escapeHtml(player.ruoloPrevalente):'-')+'</span></div>'+
      '<div class="rc-row"><span>Note</span><span>'+(player.note?escapeHtml(player.note):'-')+'</span></div>'+
      '<a class="rc-edit-link" href="'+editUrl+'">&#9998; Modifica in Squadra</a>'+
    '</div>'+
  '</div>';
}

function renderTabScheda(player){
  return renderTabDati(player) + renderTabRiepilogo(player);
}

function renderTabValutazione(player){
  var scores = getScores(player);
  var html = '';
  SKILL_GROUPS.forEach(function(g){
    var gAvg = groupAverage(scores,g);
    html += '<div class="group" style="--group-color:'+g.color+'">'+
      '<div class="group-title"><h3>'+g.label+'</h3><span class="group-avg">media '+fmt(gAvg)+'</span></div>';
    g.subsections.forEach(function(sub){
      var subAvg = subsectionAverage(scores, sub);
      html += '<div class="subsection">';
      if(sub.name){
        html += '<div class="subsection-title"><h4>'+sub.name+'</h4><span class="subsection-avg">media '+fmt(subAvg)+'</span></div>';
      }
      sub.skills.forEach(function(s){
        var v = scores[s.id];
        var hasVal = (v!==undefined && v!==null && v!=='');
        var vNum = hasVal ? Number(v) : 3;
        html += '<div class="skill-row">'+
          '<div class="skill-top"><span class="skill-name">'+s.name+'</span>'+
            '<span class="skill-value" style="background:'+(hasVal?scoreColor(vNum):'#999')+'" id="val_'+s.id+'">'+(hasVal?vNum:'-')+'</span></div>'+
          '<p class="skill-desc">'+s.desc+'</p>'+
          '<input type="range" min="1" max="5" step="1" value="'+vNum+'" data-skill="'+s.id+'" style="--group-color:'+g.color+'">'+
          '<div class="scale-hint"><span>1 Insuff.</span><span>3 Adeguato</span><span>5 Eccellente</span></div>'+
        '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}

function renderTabRiepilogo(player){
  var scores = getScores(player);
  var tot = totalAverage(scores);
  var prevKey = previousPeriodKey(state.activePeriod);
  var deltaHtml = '';
  if(prevKey && periodHasData(player, prevKey)){
    var prevTot = totalAverage(getScores(player, prevKey));
    if(prevTot!==null && tot!==null){
      var diff = tot - prevTot;
      var sign = diff>0 ? '+' : '';
      deltaHtml = '<span class="delta">'+sign+diff.toFixed(1)+' vs '+periodLabel(prevKey)+'</span>';
    }
  }

  var barsHtml = SKILL_GROUPS.map(function(g){
    var a = groupAverage(scores,g);
    var pct = a===null?0:(a/5*100);
    return '<div class="area-bar-row">'+
      '<div class="label-row"><span>'+g.label+'</span><span class="value-mono" style="color:'+scoreColor(a)+'">'+fmt(a)+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+g.color+'"></div></div>'+
    '</div>';
  }).join('');

  return '<button type="button" class="pdf-report-btn" id="pdfReportBtn">&#128424; Scarica PDF riepilogo</button>'+
  '<div class="summary-grid">'+
    '<div class="card">'+
      '<div class="radar-toggle">'+
        '<button data-mode="generale" class="'+(state.radarMode==='generale'?'active':'')+'">Vista generale</button>'+
        '<button data-mode="dettagliato" class="'+(state.radarMode==='dettagliato'?'active':'')+'">Vista dettagliata</button>'+
      '</div>'+
      '<canvas id="radarCanvas"></canvas>'+
    '</div>'+
    '<div>'+
      '<div class="card"><div class="area-bars">'+barsHtml+'</div>'+
        '<div class="total-badge"><span class="num">'+fmt(tot)+'</span><span class="lbl">Media Totale</span>'+deltaHtml+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function renderRadarForPlayer(player){
  var canvas = document.getElementById('radarCanvas');
  if(!canvas) return;
  var scores = getScores(player);
  var labels, values, color;
  if(state.radarMode==='generale'){
    labels = SKILL_GROUPS.map(function(g){return g.label.replace('Capacita ','');});
    values = SKILL_GROUPS.map(function(g){ var a=groupAverage(scores,g); return a===null?0:a; });
    color = getCss('--pitch');
  } else {
    labels = []; values = [];
    SKILL_GROUPS.forEach(function(g){
      g.subsections.forEach(function(sub){
        if(sub.name){
          labels.push(sub.name);
          var a = subsectionAverage(scores, sub);
          values.push(a===null?0:a);
        } else {
          sub.skills.forEach(function(s){
            labels.push(s.name);
            var v = scores[s.id];
            values.push(v===undefined||v===null||v===''?0:Number(v));
          });
        }
      });
    });
    color = getCss('--gold');
  }
  drawRadar(canvas, labels, values, color);
}

/* ============================================================
   EVENTI VISTA GIOCATORE
============================================================ */
function attachPlayerEvents(player){
  Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function(btn){
    btn.addEventListener('click', function(){ state.activeTab = btn.getAttribute('data-tab'); renderMain(); });
  });

  var delBtn = document.getElementById('deletePlayerBtn');
  if(delBtn){
    delBtn.addEventListener('click', function(){
      confirmModal('Eliminare giocatore?', 'Questa azione rimuovera\' definitivamente "'+player.nome+'" dalla rosa (Squadra) e tutte le sue valutazioni/autovalutazioni.', function(){
        window.SquadraStore.deletePlayer(player.id);
        state.players = state.players.filter(function(p){return p.id!==player.id;});
        state.view='squad'; state.activePlayerId=null;
        renderAll(); showToast('Giocatore eliminato.');
      });
    });
  }

  if(state.activeTab==='scheda'){
    Array.prototype.forEach.call(document.querySelectorAll('.radar-toggle button'), function(btn){
      btn.addEventListener('click', function(){ state.radarMode = btn.getAttribute('data-mode'); renderMain(); });
    });
    window.addEventListener('resize', debounce(function(){
      if(state.view==='player' && state.activeTab==='scheda'){ renderRadarForPlayer(player); }
    }, 200));
    var pdfBtn = document.getElementById('pdfReportBtn');
    if(pdfBtn){
      pdfBtn.addEventListener('click', function(){
        window.RugbyReport.openPlayerReport(window.SquadraStore.getPlayer(player.id) || player, state.activePeriod);
      });
    }
  }

  if(state.activeTab==='valutazione'){
    var scores = getScores(player);
    Array.prototype.forEach.call(document.querySelectorAll('input[type=range]'), function(slider){
      slider.addEventListener('input', function(){
        var skillId = slider.getAttribute('data-skill');
        var v = Number(slider.value);
        scores[skillId] = v;
        var valEl = document.getElementById('val_'+skillId);
        valEl.textContent = v;
        valEl.style.background = scoreColor(v);

        var group=null, subsection=null;
        SKILL_GROUPS.forEach(function(g){ g.subsections.forEach(function(sub){ if(sub.skills.some(function(s){return s.id===skillId;})){ group=g; subsection=sub; } }); });
        var subEl = slider.closest('.subsection');
        if(subsection && subsection.name && subEl){
          var subAvg = subsectionAverage(scores, subsection);
          subEl.querySelector('.subsection-avg').textContent = 'media ' + fmt(subAvg);
        }
        var groupEl = slider.closest('.group');
        var gAvg = groupAverage(scores, group);
        groupEl.querySelector('.group-avg').textContent = 'media ' + fmt(gAvg);

        saveData(); renderSidebar(); updateSubtitle();
      });
    });
  }

}
function debounce(fn,ms){ var t; return function(){ clearTimeout(t); var args=arguments; t=setTimeout(function(){fn.apply(null,args);},ms); }; }

/* ============================================================
   TOP LEVEL EVENTS
============================================================ */
document.getElementById('squadViewBtn').addEventListener('click', function(){ state.view='squad'; state.activePlayerId=null; renderAll(); });
document.getElementById('newPlayerBtn').addEventListener('click', function(){
  window.location.href = '../squadra/?season='+encodeURIComponent(state.activeSeasonId)+'&new=1';
});
document.getElementById('searchInput').addEventListener('input', function(e){ state.search=e.target.value; renderSidebar(); });

document.getElementById('squadraLinkBtn').addEventListener('click', function(){
  window.location.href = '../squadra/?season='+encodeURIComponent(state.activeSeasonId);
});
document.getElementById('riepilogoLinkBtn').addEventListener('click', function(){
  window.location.href = '../riepilogo/?season='+encodeURIComponent(state.activeSeasonId);
});
document.getElementById('confrontoLinkBtn').addEventListener('click', function(){
  if(!state.activePlayerId) return;
  window.location.href = '../confronto/?player='+encodeURIComponent(state.activePlayerId)+'&season='+encodeURIComponent(state.activeSeasonId);
});

function renderSeasonSelect(){
  var sel = document.getElementById('seasonSelect');
  var seasons = window.SquadraStore.getSeasons();
  sel.innerHTML = seasons.map(function(s){
    return '<option value="'+s.id+'"'+(s.id===state.activeSeasonId?' selected':'')+'>'+escapeHtml(s.label)+'</option>';
  }).join('');
}
document.getElementById('seasonSelect').addEventListener('change', function(e){
  state.activeSeasonId = e.target.value;
  window.SquadraStore.setActiveSeasonId(e.target.value);
  window.SquadraStore.syncAppPlayers(state.players, state.activeSeasonId, {
    richFields: true,
    createLocal: function(sp){ return newPlayer(sp.nome, sp.id); }
  });
  state.players.forEach(ensurePlayerShape);
  state.view='squad'; state.activePlayerId=null;
  renderAll();
});

document.getElementById('exportBtn').addEventListener('click', function(){
  var data = JSON.stringify({players: state.players}, null, 2);
  var blob = new Blob([data], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = new Date();
  function pad(n){ return String(n).length<2 ? '0'+n : ''+n; }
  var stamp = d.getFullYear()+''+pad(d.getMonth()+1)+''+pad(d.getDate());
  a.href = url; a.download = 'backup_rugby_u14_'+stamp+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup scaricato.');
});
document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('importFile').click(); });
document.getElementById('importFile').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var parsed = JSON.parse(ev.target.result);
      if(!parsed.players || !Array.isArray(parsed.players)) throw new Error('formato non valido');
      confirmModal('Caricare backup?', 'Verranno sostituiti tutti i '+state.players.length+' giocatori attuali con i '+parsed.players.length+' del file caricato.', function(){
        state.players = parsed.players.map(function(p){
          if(p.valutazioni===undefined && p.scores!==undefined) return migrateLegacyPlayer(p);
          return ensurePlayerShape(p);
        });
        state.view='squad'; state.activePlayerId=null;
        renderAll(); showToast('Backup caricato correttamente.');
      });
    }catch(err){ showToast('File non valido. Assicurati che sia un backup esportato da questa app.'); }
    e.target.value = '';
  };
  reader.readAsText(file);
});

document.getElementById('driveBackupBtn').addEventListener('click', function(){
  var btn = document.getElementById('driveBackupBtn');
  var original = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '\u2601 Backup...';
  var data = JSON.stringify({players: state.players}, null, 2);
  window.RugbyDriveBackup.backup(data, 'backup_valutazione.json', function(){
    btn.disabled = false; btn.innerHTML = original;
    showToast('Backup salvato su Google Drive.');
  }, function(err){
    btn.disabled = false; btn.innerHTML = original;
    showToast((err && err.message) ? err.message : 'Backup su Drive non riuscito.');
    if(window.console) console.error(err);
  });
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('../service-worker.js', {scope:'../'}).catch(function(){});
}

var menuToggle = document.getElementById('menuToggle');
var sidebar = document.getElementById('sidebar');
menuToggle.addEventListener('click', function(){ sidebar.classList.toggle('open'); });
function closeSidebarMobile(){ sidebar.classList.remove('open'); }

/* ============================================================
   INIT
============================================================ */
loadData();
renderAll();

})();
