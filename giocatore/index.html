<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="theme-color" content="#004860">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Giocatore — Rugby U14</title>
<style>
:root{
  --bg:#F2EFE6; --surface:#FFFFFF; --surface-2:#F6F3EC;
  --ink:#12232A; --ink-soft:#51666D;
  --pitch:#004860; --pitch-dark:#00212F; --pitch-line:#DDD1B8;
  --gold:#7C6650; --gold-soft:#EDE4D2;
  --low:#B5533C; --mid:#B8701F; --high:#2E8F72;
  --shadow: 0 2px 10px rgba(18,35,42,0.08);
  --shadow-lg: 0 12px 32px rgba(18,35,42,0.16);
  --radius: 14px;
  --font-display: 'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono: 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--font-body);background:radial-gradient(circle at 100% 0%, rgba(0,72,96,0.07), transparent 45%),var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}

.topbar{display:flex;align-items:center;gap:16px;padding:14px 20px;background:linear-gradient(135deg,var(--pitch) 0%, var(--pitch-dark) 100%);color:#fff;box-shadow:var(--shadow);flex-wrap:wrap;}
.topbar .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.topbar .brand img{height:34px;width:auto;flex-shrink:0;}
.topbar h1{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.topbar button{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.28);color:#fff;padding:9px 12px;border-radius:10px;font-size:13px;cursor:pointer;}
.topbar button:hover{background:rgba(255,255,255,0.22);}

.main{max-width:820px;margin:0 auto;padding:22px 20px 70px 20px;}
.player-header{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.avatar-lg{width:64px;height:64px;border-radius:50%;background:var(--pitch);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:22px;background-size:cover;background-position:center;flex-shrink:0;}
.player-header h2{font-family:var(--font-display);font-size:26px;margin:0;}
.player-header .meta{font-size:13px;color:var(--ink-soft);}
.player-header .edit-link{margin-left:auto;font-size:12.5px;color:var(--pitch);text-decoration:none;border:1px solid var(--pitch-line);padding:7px 12px;border-radius:9px;white-space:nowrap;}
.player-header .edit-link:hover{background:var(--gold-soft);}

.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.period-switch{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;}
.period-switch button{border:none;background:transparent;padding:8px 12px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
.period-switch button.active{background:var(--gold);color:#fff;}
.filters .spacer{flex:1;}

.tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--surface-2);padding:5px;border-radius:12px;width:fit-content;flex-wrap:wrap;}
.tab-btn{border:none;background:transparent;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.tab-btn.active{background:var(--pitch);color:#fff;box-shadow:var(--shadow);}

.card{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px;}
.intro-note{font-size:13px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-bottom:18px;line-height:1.5;}
.period-banner{display:flex;align-items:center;gap:10px;margin:0 0 18px 0;padding:9px 14px;border-radius:10px;background:var(--surface-2);color:var(--ink-soft);font-size:13px;font-weight:600;flex-wrap:wrap;}
.period-banner strong{color:var(--ink);}

/* Skill groups (Valutazione tecnica) */
.group{border-left:4px solid var(--group-color, var(--pitch));padding-left:16px;margin-bottom:26px;}
.group:last-child{margin-bottom:4px;}
.group-title{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.group-title h3{font-family:var(--font-display);font-size:18px;margin:0;color:var(--group-color,var(--pitch));}
.group-avg{font-family:var(--font-mono);font-size:13px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--surface-2);color:var(--group-color,var(--pitch));border:1px solid var(--group-color,var(--pitch));}
.subsection{margin-bottom:16px;}
.subsection:last-child{margin-bottom:0;}
.subsection-title{display:flex;align-items:center;gap:8px;margin:0 0 4px 0;}
.subsection-title h4{font-size:13px;font-weight:700;margin:0;color:var(--ink);text-transform:uppercase;letter-spacing:0.4px;}
.subsection-avg{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink-soft);}

.skill-row{padding:12px 0;border-bottom:1px solid var(--pitch-line);}
.skill-row:last-child{border-bottom:none;}
.skill-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px;}
.skill-name{font-size:14px;font-weight:600;}
.skill-desc{font-size:11.5px;color:var(--ink-soft);margin:0 0 8px 0;line-height:1.4;}
.skill-value{font-family:var(--font-mono);font-weight:700;font-size:13px;min-width:20px;text-align:center;padding:2px 9px;border-radius:8px;color:#fff;flex-shrink:0;}

/* Pulsanti a scelta (usati sia per Valutazione sia per Autovalutazione) */
.freq-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
@media (max-width:640px){.freq-row{grid-template-columns:repeat(5,1fr);gap:4px;}}
.freq-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:10px;border:1.5px solid var(--pitch-line);background:var(--surface-2);cursor:pointer;}
.freq-btn .emo{font-size:19px;}
.freq-btn .band{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);font-weight:700;}
.freq-btn .lbl{font-size:9.5px;color:var(--ink-soft);text-align:center;line-height:1.2;}
.freq-btn.selected{border-color:var(--group-color,var(--pitch));background:var(--group-color,var(--pitch));}
.freq-btn.selected .band,.freq-btn.selected .lbl{color:#fff;}

.tecnico-banner{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:10px 14px;border-radius:10px;background:var(--gold-soft);color:var(--pitch-dark);font-size:13px;flex-wrap:wrap;}
.tecnico-banner button{border:1px solid var(--pitch-dark);background:transparent;color:var(--pitch-dark);padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;margin-left:auto;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field:last-child{margin-bottom:0;}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.3px;}
.field input,.field textarea{padding:10px 12px;border-radius:9px;border:1px solid var(--pitch-line);background:var(--surface-2);font-size:14.5px;color:var(--ink);}
.field textarea{resize:vertical;min-height:70px;}
.field input:focus,.field textarea:focus{outline:2px solid var(--pitch);outline-offset:0;}

.pdf-btn{background:var(--pitch);color:#fff;border:none;padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:14px;}
canvas{max-width:100%;display:block;margin:0 auto 18px auto;}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;font-size:12.5px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
#reportHost{margin-top:6px;}
.empty-msg{text-align:center;color:var(--ink-soft);padding:40px 16px;}
</style>
</head>

var VAL_KEY = 'rugbyU14_valutazioni_v2';
var AUTO_KEY = 'rugbyU14_autovalutazione_v1';

var valData = { players: [] };

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(v){ return (v===null||v===undefined||isNaN(v)) ? '-' : v.toFixed(1); }
function scoreColor(v){ if(v===null||v===undefined||isNaN(v)) return '#999'; if(v<2) return 'var(--low)'; if(v<3.5) return 'var(--mid)'; return 'var(--high)'; }
function periodLabel(key){ var p = PERIODS.find(function(x){return x.key===key;}); return p?p.label:key; }
function previousPeriodKey(key){ var idx = PERIODS.findIndex(function(p){return p.key===key;}); return idx>0 ? PERIODS[idx-1].key : null; }
function uid(){ return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

/* ---------------- Identita' tecnico ---------------- */
function normTecnico(s){ return (String(s||'').trim().toLowerCase().replace(/\s+/g,' ')) || 'tecnico'; }
function loadCurrentTecnico(){
  var nome = localStorage.getItem(TECNICO_NOME_KEY);
  if(!nome){
    nome = (window.prompt('Come ti chiami? Il nome serve per distinguere le valutazioni quando piu\' di un tecnico usa questa scheda.', '') || '').trim() || 'Tecnico';
    localStorage.setItem(TECNICO_NOME_KEY, nome);
  }
  CURRENT_TECNICO = { id: normTecnico(nome), nome: nome };
  if(window.RugbyCloudSync) window.RugbyCloudSync.setTecnico(CURRENT_TECNICO.id, CURRENT_TECNICO.nome);
}
function changeCurrentTecnico(){
  var nome = (window.prompt('Nome del tecnico che sta usando questa scheda ora:', CURRENT_TECNICO.nome) || '').trim();
  if(!nome) return;
  localStorage.setItem(TECNICO_NOME_KEY, nome);
  CURRENT_TECNICO = { id: normTecnico(nome), nome: nome };
  if(window.RugbyCloudSync) window.RugbyCloudSync.setTecnico(CURRENT_TECNICO.id, CURRENT_TECNICO.nome);
  renderAll();
}

/* ---------------- Dati: Valutazione tecnica ---------------- */
function ensureValPlayerShape(p){
  if(!p.ruoli) p.ruoli = [];
  if(p.ruoloPrevalente===undefined) p.ruoloPrevalente = p.ruoli[0] || '';
  if(p.annoNascita===undefined) p.annoNascita = '';
  if(p.foto===undefined) p.foto = '';
  if(!p.valutazioni) p.valutazioni = {};
  PERIODS.forEach(function(per){
    var pd = p.valutazioni[per.key];
    if(!pd) pd = p.valutazioni[per.key] = {};
    if(!pd.byTecnico){
      pd.byTecnico = {};
      if(pd.scores && Object.keys(pd.scores).length && CURRENT_TECNICO){
        pd.byTecnico[CURRENT_TECNICO.id] = { nome: CURRENT_TECNICO.nome, scores: pd.scores };
      }
    }
    delete pd.scores;
  });
  return p;
}
function newValPlayer(nome, id){
  var p = { id: id || uid(), nome: nome || 'Nuovo giocatore', ruoli:[], ruoloPrevalente:'', annoNascita:'', note:'', foto:'', valutazioni:{} };
  ensureValPlayerShape(p);
  return p;
}
function valPlayer(){ return valData.players.find(function(p){ return p.id===playerId; }); }
function getTecnicoScores(player, period, tecnicoId, tecnicoNome){
  ensureValPlayerShape(player);
  var pd = player.valutazioni[period || state.activePeriod];
  if(!pd.byTecnico[tecnicoId]) pd.byTecnico[tecnicoId] = { nome: tecnicoNome || tecnicoId, scores: {} };
  return pd.byTecnico[tecnicoId].scores;
}
function getValScores(period){ return getTecnicoScores(valPlayer(), period, CURRENT_TECNICO.id, CURRENT_TECNICO.nome); }
function saveVal(){
  try{ localStorage.setItem(VAL_KEY, JSON.stringify(valData)); }catch(e){}
  if(window.RugbyCloudSync) window.RugbyCloudSync.notifyLocalChange(VAL_KEY);
}
function valSubsectionAverage(scores, sub){
  var sum=0,n=0;
  sub.skills.forEach(function(s){ var v=scores[s.id]; if(v!==undefined&&v!==null&&v!==''){ sum+=Number(v); n++; } });
  return n>0 ? sum/n : null;
}
function valGroupAverage(scores, group){
  var sum=0,n=0;
  group.subsections.forEach(function(sub){ var a=valSubsectionAverage(scores,sub); if(a!==null){ sum+=a; n++; } });
  return n>0 ? sum/n : null;
}
function valTotalAverage(scores){
  var sum=0,n=0;
  VAL_SKILL_GROUPS.forEach(function(g){ var a=valGroupAverage(scores,g); if(a!==null){ sum+=a; n++; } });
  return n>0 ? sum/n : null;
}

/* ---------------- Dati: Autovalutazione ---------------- */
function ensureAutoPlayerShape(p){
  if(p.annoNascita===undefined) p.annoNascita = '';
  if(p.foto===undefined) p.foto = '';
  if(!p.valutazioni) p.valutazioni = {};
  PERIODS.forEach(function(per){
    if(!p.valutazioni[per.key]) p.valutazioni[per.key] = {scores:{}, obiettivoPersonale:'', obiettivoTecnico:'', ruoloDesiderato:''};
    if(!p.valutazioni[per.key].scores) p.valutazioni[per.key].scores = {};
    if(p.valutazioni[per.key].obiettivoPersonale===undefined) p.valutazioni[per.key].obiettivoPersonale = '';
    if(p.valutazioni[per.key].obiettivoTecnico===undefined) p.valutazioni[per.key].obiettivoTecnico = '';
    if(p.valutazioni[per.key].ruoloDesiderato===undefined) p.valutazioni[per.key].ruoloDesiderato = '';
  });
  return p;
}
function newAutoPlayer(nome, id){
  var p = { id: id || uid(), nome: nome || 'Nuovo giocatore', annoNascita:'', foto:'', valutazioni:{} };
  ensureAutoPlayerShape(p);
  return p;
}
function autoPlayer(){ return autoData.players.find(function(p){ return p.id===playerId; }); }
function getAutoPeriodData(period){ var p = autoPlayer(); ensureAutoPlayerShape(p); return p.valutazioni[period || state.activePeriod]; }
function getAutoScores(period){ return getAutoPeriodData(period).scores; }
function saveAuto(){
  try{ localStorage.setItem(AUTO_KEY, JSON.stringify(autoData)); }catch(e){}
  if(window.RugbyCloudSync) window.RugbyCloudSync.notifyLocalChange(AUTO_KEY);
}
function autoGroupAverage(scores, group){
  var sum=0,n=0;
  group.skills.forEach(function(s){ var v=scores[s.id]; if(v!==undefined&&v!==null&&v!==''){ sum+=Number(v); n++; } });
  return n>0 ? sum/n : null;
}
function autoTotalAverage(scores){
  var sum=0,n=0;
  AUTO_SKILL_GROUPS.forEach(function(g){ var a=autoGroupAverage(scores,g); if(a!==null){ sum+=a; n++; } });
  return n>0 ? sum/n : null;
}

/* ---------------- Caricamento ---------------- */
function loadAll(){
  loadCurrentTecnico();
  try{ var raw = localStorage.getItem(VAL_KEY); if(raw){ valData = JSON.parse(raw); if(!valData.players) valData.players=[]; } }catch(e){ valData = {players:[]}; }
  try{ var raw2 = localStorage.getItem(AUTO_KEY); if(raw2){ autoData = JSON.parse(raw2); if(!autoData.players) autoData.players=[]; } }catch(e){ autoData = {players:[]}; }
  valData.players.forEach(ensureValPlayerShape);
  autoData.players.forEach(ensureAutoPlayerShape);

  if(qs.get('season')) SS.setActiveSeasonId(qs.get('season'));
  state.activeSeasonId = SS.getActiveSeasonId();

  var valJsonBefore = JSON.stringify(valData);
  var autoJsonBefore = JSON.stringify(autoData);

  SS.syncAppPlayers(valData.players, state.activeSeasonId, { richFields:true, createLocal:function(sp){ return newValPlayer(sp.nome, sp.id); } });
  valData.players.forEach(ensureValPlayerShape);
  SS.syncAppPlayers(autoData.players, state.activeSeasonId, { richFields:false, createLocal:function(sp){ return newAutoPlayer(sp.nome, sp.id); } });
  autoData.players.forEach(ensureAutoPlayerShape);

  /* SS.syncAppPlayers() qui sopra puo' aver creato nuove voci (in
     memoria) per giocatori gia' in rosa ma senza ancora una scheda
     locale su questo dispositivo (es. chiave mai scritta qui, o
     azzerata da una pulizia dati del browser). Se non le salviamo
     subito, restano SOLO in memoria: la pagina Riepilogo e la
     sincronizzazione cloud leggono la chiave direttamente da
     localStorage, quindi senza questo salvataggio non vedrebbero mai
     queste voci. */
  if(JSON.stringify(valData) !== valJsonBefore) saveVal();
  if(JSON.stringify(autoData) !== autoJsonBefore) saveAuto();
}

/* ---------------- Render ---------------- */
function renderAll(){
  var sharedPlayer = SS.getPlayer(playerId);
  var main = document.getElementById('main');
  if(!playerId || !sharedPlayer){
    main.innerHTML = '<div class="empty-msg">Nessun giocatore selezionato.<br><br>Apri un giocatore dalla pagina Rosa.</div>';
    document.getElementById('pageTitle').textContent = 'Giocatore';
    if(window.RugbyCloudSync) window.RugbyCloudSync.mountStatusBadge('cloudStatusHost');
    return;
  }
  document.getElementById('pageTitle').textContent = sharedPlayer.nome;
  document.getElementById('tecnicoName').textContent = CURRENT_TECNICO.nome;

  var avatar = sharedPlayer.foto ? '<div class="avatar-lg" style="background-image:url(&quot;'+sharedPlayer.foto+'&quot;)"></div>' : '<div class="avatar-lg">'+(SS.getInitials(sharedPlayer.nome)||'?')+'</div>';
  var metaParts = [sharedPlayer.ruoloPrevalente, sharedPlayer.annoNascita ? ('Nato nel '+sharedPlayer.annoNascita) : ''].filter(Boolean).join(' &middot; ');
  var editUrl = '../squadra/?player='+encodeURIComponent(sharedPlayer.id)+'&season='+encodeURIComponent(state.activeSeasonId)+'&edit=1';

  var html = '<div class="player-header">'+avatar+
    '<div><h2>'+escapeHtml(sharedPlayer.nome)+'</h2><div class="meta">'+metaParts+'</div></div>'+
    '<a class="edit-link" href="'+editUrl+'">&#9998; Modifica dati</a>'+
  '</div>';

  html += '<div class="filters"><div class="period-switch" id="periodSwitch"></div></div>';
  html += '<div class="tabs" id="tabsWrap">'+
    tabBtn('panoramica','Panoramica')+ tabBtn('valutazione','Valutazione')+ tabBtn('autovalutazione','Autovalutazione')+ tabBtn('obiettivi','Obiettivi') +
  '</div>';
  html += '<div id="tabContent"></div>';

  main.innerHTML = html;
  renderPeriodSwitch();
  Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function(btn){
    btn.addEventListener('click', function(){ state.activeTab = btn.getAttribute('data-tab'); renderAll(); });
  });
  renderTabContent(sharedPlayer);

  if(window.RugbyCloudSync) window.RugbyCloudSync.mountStatusBadge('cloudStatusHost');
}
function tabBtn(key,label){ return '<button class="tab-btn'+(state.activeTab===key?' active':'')+'" data-tab="'+key+'">'+label+'</button>'; }

function renderPeriodSwitch(){
  var el = document.getElementById('periodSwitch');
  el.innerHTML = PERIODS.map(function(p){ return '<button data-period="'+p.key+'" class="'+(state.activePeriod===p.key?'active':'')+'">'+p.label+'</button>'; }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('button'), function(btn){
    btn.addEventListener('click', function(){ state.activePeriod = btn.getAttribute('data-period'); renderAll(); });
  });
}

function renderTabContent(sharedPlayer){
  var host = document.getElementById('tabContent');
  if(state.activeTab==='valutazione') host.innerHTML = renderValutazioneTab();
  else if(state.activeTab==='autovalutazione') host.innerHTML = renderAutovalutazioneTab();
  else if(state.activeTab==='obiettivi') host.innerHTML = renderObiettiviTab();
  else host.innerHTML = renderPanoramicaTab(sharedPlayer);
  attachTabEvents(sharedPlayer);
  if(state.activeTab==='panoramica') drawComparisonRadar(sharedPlayer);
}

/* ---------- Tab: Valutazione tecnica ---------- */
function renderValutazioneTab(){
  var scores = getValScores(state.activePeriod);
  var altri = ED.getValTecnici(playerId, state.activePeriod).filter(function(t){ return t.id!==CURRENT_TECNICO.id; });
  var banner = '<div class="tecnico-banner">Stai inserendo la valutazione di <strong>'+escapeHtml(CURRENT_TECNICO.nome)+'</strong>'+
    (altri.length ? ' — presenti anche: '+altri.map(function(t){return escapeHtml(t.nome);}).join(', ')+' (vedi Panoramica)' : '')+
    '<button type="button" id="changeTecnicoBtn2">Cambia tecnico</button>'+
  '</div>';
  var html = banner;
  VAL_SKILL_GROUPS.forEach(function(g){
    var gAvg = valGroupAverage(scores, g);
    html += '<div class="group" style="--group-color:'+g.color+'">'+
      '<div class="group-title"><h3>'+g.label+'</h3><span class="group-avg">media '+fmt(gAvg)+'</span></div>';
    g.subsections.forEach(function(sub){
      var subAvg = valSubsectionAverage(scores, sub);
      html += '<div class="subsection">';
      if(sub.name) html += '<div class="subsection-title"><h4>'+sub.name+'</h4><span class="subsection-avg">media '+fmt(subAvg)+'</span></div>';
      sub.skills.forEach(function(s){
        var v = scores[s.id];
        var hasVal = (v!==undefined && v!==null && v!=='');
        html += '<div class="skill-row"><div class="skill-top"><span class="skill-name">'+s.name+'</span>'+
          '<span class="skill-value" style="background:'+(hasVal?scoreColor(Number(v)):'#999')+'">'+(hasVal?Number(v):'-')+'</span></div>'+
          '<p class="skill-desc">'+s.desc+'</p>'+
          '<div class="freq-row" data-skill="'+s.id+'">'+
            VAL_LEVELS.map(function(lv){
              var selected = hasVal && Number(v)===lv.value;
              return '<button type="button" class="freq-btn'+(selected?' selected':'')+'" data-value="'+lv.value+'" style="--group-color:'+g.color+'">'+
                '<span class="band">'+lv.band+'</span><span class="lbl">'+lv.lbl+'</span></button>';
            }).join('')+
          '</div>'+
        '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}

/* ---------- Tab: Autovalutazione ---------- */
function renderAutovalutazioneTab(){
  var scores = getAutoScores(state.activePeriod);
  var html = '<div class="intro-note">Per ogni frase scegli quante volte su 10 tentativi ti succede davvero, non come vorresti che fosse. Non ci sono risposte giuste o sbagliate: serve a capire da dove partire.</div>';
  AUTO_SKILL_GROUPS.forEach(function(g){
    var gAvg = autoGroupAverage(scores, g);
    html += '<div class="group" style="--group-color:'+g.color+'">'+
      '<div class="group-title"><h3>'+g.label+'</h3><span class="group-avg">media '+fmt(gAvg)+'</span></div>';
    g.skills.forEach(function(s){
      var v = scores[s.id];
      html += '<div class="skill-row"><div class="skill-name">'+s.name+'</div>'+
        '<div class="freq-row" data-skill="'+s.id+'">'+
          FREQ_LEVELS.map(function(f){
            var selected = (v!==undefined && v!==null && v!=='' && Number(v)===f.value);
            return '<button type="button" class="freq-btn'+(selected?' selected':'')+'" data-value="'+f.value+'" style="--group-color:'+g.color+'">'+
              '<span class="emo">'+f.emo+'</span><span class="band">'+f.band+'</span><span class="lbl">'+f.lbl+'</span></button>';
          }).join('')+
        '</div>'+
      '</div>';
    });
    html += '</div>';
  });
  return html;
}

/* ---------- Tab: Obiettivi ---------- */
function renderObiettiviTab(){
  var pd = getAutoPeriodData(state.activePeriod);
  return '<div class="intro-note">Uno o due obiettivi per il periodo di '+periodLabel(state.activePeriod)+': uno personale (es. atteggiamento, impegno) e uno tecnico (es. un gesto da migliorare).</div>'+
  '<div class="card">'+
    '<div class="field"><label>Obiettivo personale</label>'+
      '<textarea id="fObPersonale" placeholder="Es: voglio incoraggiare di piu i compagni durante la partita">'+escapeHtml(pd.obiettivoPersonale)+'</textarea></div>'+
    '<div class="field"><label>Obiettivo tecnico</label>'+
      '<textarea id="fObTecnico" placeholder="Es: voglio migliorare il passaggio con la mano sinistra">'+escapeHtml(pd.obiettivoTecnico)+'</textarea></div>'+
    '<div class="field"><label>Ruolo desiderato</label>'+
      '<input type="text" id="fRuoloDesiderato" placeholder="Es: terza linea, mediano di apertura..." value="'+escapeHtml(pd.ruoloDesiderato)+'"></div>'+
  '</div>';

/* ---------- Tab: Panoramica (confronto tra tutte le valutazioni) ---------- */
var PLAYER_COLOR = '#7C6650';
function getComparisonSeries(){
  var tecnici = ED.getValTecnici(playerId, state.activePeriod);
  var autoAvgs = ED.autoGroupAverages(playerId, state.activePeriod);
  var series = tecnici.map(function(t){
    var valAvgs = ED.valGroupAverages(playerId, state.activePeriod, t.id);
    return { nome: t.nome, color: t.color, values: ED.COMPARISON_MAP.map(function(m){ return valAvgs[m.valKey]||0; }) };
  });
  series.push({ nome:'Giocatore', color:PLAYER_COLOR, values: ED.COMPARISON_MAP.map(function(m){ return autoAvgs[m.autoKey]||0; }) });
  return series;
}
function renderPanoramicaTab(sharedPlayer){
  return '<button class="pdf-btn" id="pdfBtn">&#128424; Scarica PDF</button>'+
    '<canvas id="radarCanvas" width="400" height="400"></canvas>'+
    '<div class="legend" id="legendHost"></div>'+
    '<div id="reportHost"></div>';
}
function renderLegend(series){
  document.getElementById('legendHost').innerHTML = series.map(function(s){
    return '<span><i style="background:'+s.color+'"></i>'+escapeHtml(s.nome)+'</span>';
  }).join('');
}
function drawComparisonRadar(sharedPlayer){
  var canvas = document.getElementById('radarCanvas');
  if(!canvas) return;
  var series = getComparisonSeries();
  renderLegend(series);
  document.getElementById('reportHost').innerHTML = window.RugbyReport.playerSectionHtml(sharedPlayer, state.activePeriod, {skipHeader:true});

  var cssSize = Math.min(360, canvas.parentElement.clientWidth);
  var dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssSize+'px'; canvas.style.height = cssSize+'px';
  canvas.width = cssSize*dpr; canvas.height = cssSize*dpr;
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var size = cssSize, cx=size/2, cy=size/2;
  var labelPad = 56, radius = size/2 - labelPad;
  var labels = ED.COMPARISON_MAP.map(function(m){return m.label;});
  var n = labels.length, maxVal=5;
  ctx.clearRect(0,0,size,size);
  var i,ang,x,y,r;
  ctx.strokeStyle = '#DDD1B8'; ctx.lineWidth = 1;
  for(r=1;r<=5;r++){
    var rr = radius*(r/5);
    ctx.beginPath();
    for(i=0;i<=n;i++){ ang=(Math.PI*2*i/n)-Math.PI/2; x=cx+rr*Math.cos(ang); y=cy+rr*Math.sin(ang); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.stroke();
  }
  for(i=0;i<n;i++){ ang=(Math.PI*2*i/n)-Math.PI/2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+radius*Math.cos(ang), cy+radius*Math.sin(ang)); ctx.stroke(); }
  function plot(values, color, alpha){
    ctx.beginPath();
    var vv,rr2,xx,yy;
    for(i=0;i<n;i++){ ang=(Math.PI*2*i/n)-Math.PI/2; vv=values[i]; rr2=radius*(vv/maxVal); xx=cx+rr2*Math.cos(ang); yy=cy+rr2*Math.sin(ang); if(i===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
    ctx.closePath();
    ctx.fillStyle = color+alpha; ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  }
  series.forEach(function(s){ plot(s.values, s.color, '33'); });
  ctx.fillStyle = '#51666D';
  ctx.font = '12px -apple-system, sans-serif';
  for(i=0;i<n;i++){
    ang=(Math.PI*2*i/n)-Math.PI/2;
    var lx=cx+(radius+16)*Math.cos(ang), ly=cy+(radius+16)*Math.sin(ang);
    var align='center'; if(Math.cos(ang)>0.3) align='left'; else if(Math.cos(ang)<-0.3) align='right';
    ctx.textAlign=align; ctx.textBaseline='middle';
    ctx.fillText(labels[i], lx, ly);
  }
}

/* ---------------- Eventi per tab ---------------- */
function attachTabEvents(sharedPlayer){
  if(state.activeTab==='valutazione'){
    var btn2 = document.getElementById('changeTecnicoBtn2');
    if(btn2) btn2.addEventListener('click', changeCurrentTecnico);
    var scores = getValScores(state.activePeriod);
    Array.prototype.forEach.call(document.querySelectorAll('#tabContent .freq-row'), function(row){
      var skillId = row.getAttribute('data-skill');
      Array.prototype.forEach.call(row.querySelectorAll('.freq-btn'), function(b){
        b.addEventListener('click', function(){
          var val = Number(b.getAttribute('data-value'));
          scores[skillId] = val;
          Array.prototype.forEach.call(row.querySelectorAll('.freq-btn'), function(x){ x.classList.remove('selected'); });
          b.classList.add('selected');
          var valEl = row.closest('.skill-row').querySelector('.skill-value');
          if(valEl){ valEl.textContent = val; valEl.style.background = scoreColor(val); }
          var group=null, subsection=null;
          VAL_SKILL_GROUPS.forEach(function(g){ g.subsections.forEach(function(sub){ if(sub.skills.some(function(s){return s.id===skillId;})){ group=g; subsection=sub; } }); });
          var subEl = row.closest('.subsection');
          if(subsection && subsection.name && subEl){ subEl.querySelector('.subsection-avg').textContent = 'media '+fmt(valSubsectionAverage(scores, subsection)); }
          var groupEl = row.closest('.group');
          groupEl.querySelector('.group-avg').textContent = 'media '+fmt(valGroupAverage(scores, group));
          saveVal();
        });
      });
    });
  }
  if(state.activeTab==='autovalutazione'){
    var ascores = getAutoScores(state.activePeriod);
    Array.prototype.forEach.call(document.querySelectorAll('#tabContent .freq-row'), function(row){
      var skillId = row.getAttribute('data-skill');
      Array.prototype.forEach.call(row.querySelectorAll('.freq-btn'), function(b){
        b.addEventListener('click', function(){
          var val = Number(b.getAttribute('data-value'));
          ascores[skillId] = val;
          Array.prototype.forEach.call(row.querySelectorAll('.freq-btn'), function(x){ x.classList.remove('selected'); });
          b.classList.add('selected');
          var group = AUTO_SKILL_GROUPS.find(function(g){ return g.skills.some(function(s){return s.id===skillId;}); });
          var groupEl = row.closest('.group');
          groupEl.querySelector('.group-avg').textContent = 'media '+fmt(autoGroupAverage(ascores, group));
          saveAuto();
        });
      });
    });
  }
  if(state.activeTab==='obiettivi'){
    var pd = getAutoPeriodData(state.activePeriod);
    var fObP = document.getElementById('fObPersonale');
    var fObT = document.getElementById('fObTecnico');
    var fRuoloDes = document.getElementById('fRuoloDesiderato');
    fObP.addEventListener('input', function(){ pd.obiettivoPersonale = fObP.value; saveAuto(); });
    fObT.addEventListener('input', function(){ pd.obiettivoTecnico = fObT.value; saveAuto(); });
    fRuoloDes.addEventListener('input', function(){ pd.ruoloDesiderato = fRuoloDes.value; saveAuto(); });
  }
  if(state.activeTab==='panoramica'){
    var pdfBtn = document.getElementById('pdfBtn');
    if(pdfBtn) pdfBtn.addEventListener('click', function(){ window.RugbyReport.openPlayerReport(sharedPlayer, state.activePeriod); });
    window.addEventListener('resize', debounce(function(){ if(state.activeTab==='panoramica') drawComparisonRadar(sharedPlayer); }, 200));
  }
}
function debounce(fn,ms){ var t; return function(){ clearTimeout(t); var args=arguments; t=setTimeout(function(){fn.apply(null,args);},ms); }; }

/* ---------------- Init ---------------- */
document.getElementById('tecnicoBtn').addEventListener('click', changeCurrentTecnico);
document.getElementById('squadraLinkBtn').addEventListener('click', function(){
  window.location.href = '../squadra/?season='+encodeURIComponent(state.activeSeasonId||'');
});

var styleEl = document.createElement('style');
styleEl.textContent = window.RugbyReport ? window.RugbyReport.cardCss : '';
document.head.appendChild(styleEl);

if(playerId){
  loadAll();
  renderAll();

  if(window.RugbyCloudSync){
    window.RugbyCloudSync.onDataChange(VAL_KEY, function(){ loadAll(); renderAll(); });
    window.RugbyCloudSync.onDataChange(AUTO_KEY, function(){ loadAll(); renderAll(); });
  }
  if(SS && SS.onChange){
    SS.onChange(function(){ renderAll(); });
  }
} else {
  renderAll();
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('../service-worker.js', {scope:'../'}).catch(function(){});
}

})();
